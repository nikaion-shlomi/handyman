<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C3358" />
    <title>שלומי הגמי · אגם אחזקות</title>
    <meta name="description" content="אחזקת מבנים ותיקונים — איטום, אינסטלציה, חשמל וריתוך. עבודה נקייה, מחיר סגור מראש, הגעה תוך 24 שעות." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="שלומי הגמי · אגם אחזקות" />
    <meta property="og:description" content="איטום, אינסטלציה, חשמל, ריתוך ותיקונים — 30 שנות ותק. באר יעקב, רמלה, חולון, בת ים, נס ציונה וראשון לציון." />
    <meta property="og:url" content="https://shlomi-repairs.co.il" />
    <meta property="og:image" content="https://ilog.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="he_IL" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com"
      rel="stylesheet"
    />

    <!-- 🌐 סגנונות מובנים להסתרת הכפתור המקורי ועיצוב סרגל הנגישות האקטיבי החדש -->
    <style>
      /* הסתרת כפתור הנגישות המקורי כדי שלא יפתח את ההצהרה המשפטית בלחיצה עליו */
      button[aria-label*="נגיש"], button[title*="נגיש"], .accessibility-btn, button:has(svg circle[cx="12"]) {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      /* כפתור נגישות כחול צף חדש */
      #new-global-access-btn {
        position: fixed !important;
        bottom: 100px !important;
        left: 24px !important;
        width: 60px !important;
        height: 60px !important;
        z-index: 999999 !important;
        background-color: #0056b3 !important;
        border-radius: 50% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3) !important;
        border: 2px solid #fff !important;
        cursor: pointer !important;
        color: #fff !important;
      }

      /* חלון סרגל הנגישות החדש */
      #custom-access-box {
        display: none;
        position: fixed !important;
        bottom: 175px !important;
        left: 24px !important;
        background: #ffffff !important;
        color: #071e36 !important;
        padding: 20px !important;
        border-radius: 14px !important;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25) !important;
        z-index: 9999999 !important;
        direction: rtl !important;
        text-align: right !important;
        width: 280px !important;
        font-family: 'Assistant', system-ui, sans-serif !important;
        border: 1px solid #e2e8f0 !important;
      }
      #custom-access-box button {
        width: 100% !important;
        margin-bottom: 8px !important;
        padding: 10px !important;
        background: #f5eee6 !important;
        border: 1px solid #decbc4 !important;
        border-radius: 8px !important;
        cursor: pointer !important;
        font-weight: bold !important;
        color: #071e36 !important;
        font-size: 0.95rem !important;
      }
      
      /* מחלקות להחלת הנגישות על העמוד */
      .access-large-text p, .access-large-text span, .access-large-text li, .access-large-text div { font-size: 118% !important; }
      .access-large-text h1, .access-large-text h2, .access-large-text h3 { font-size: 112% !important; }
      .access-contrast, .access-contrast div, .access-contrast section, .access-contrast main, .access-contrast body, .access-contrast header { background: #000000 !important; color: #ffffff !important; }
      .access-contrast p, .access-contrast h1, .access-contrast h2, .access-contrast h3, .access-contrast span, .access-contrast li { color: #ffffff !important; }
      .access-contrast a { color: #ffff00 !important; text-decoration: underline !important; }
    </style>
  </head>
  <body>
    <script>
      (function () {
        var stored = localStorage.getItem('handyman.lang');
        if (stored === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- ♿ יצירת כפתור הנגישות האקטיבי החדש והחלון שלו בדפדפן -->
    <button id="new-global-access-btn" title="אפשרויות נגישות" aria-label="תפריט נגישות">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><path d="m9 20 3-6 3 6"/><path d="m6 8 6 2 6-2"/><path d="M12 10v4"/></svg>
    </button>

    <div id="custom-access-box">
      <h4 style="margin:0 0 14px 0; font-size:1.1rem; border-bottom:2px solid #f2e9e4; padding-bottom:6px; font-weight:bold; color:#071e36;">סרגל כלי נגישות</h4>
      <button id="btn-inc-text">🔍 הגדל טקסט באתר</button>
      <button id="btn-dec-text">🔎 גודל טקסט רגיל</button>
      <button id="btn-contrast">🌓 מצב ניגודיות גבוהה</button>
      <button id="btn-reset" style="background:#d9534f !important; color:#fff !important; border:none !important;">🔄 איפוס הגדרות</button>
      <button id="btn-close-access" style="background:#071e36 !important; color:#fff !important; border:none !important; margin-top:4px !important;">סגור תפריט</button>
    </div>

    <script>
      // ניהול פתיחה וסגירה של חלון הנגישות
      document.getElementById('new-global-access-btn').addEventListener('click', () => {
        const box = document.getElementById('custom-access-box');
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
      });

      document.getElementById('btn-close-access').addEventListener('click', () => {
        document.getElementById('custom-access-box').style.display = 'none';
      });

      document.getElementById('btn-inc-text').addEventListener('click', () => {
        document.body.classList.add('access-large-text');
      });

      document.getElementById('btn-dec-text').addEventListener('click', () => {
        document.body.classList.remove('access-large-text');
      });

      document.getElementById('btn-contrast').addEventListener('click', () => {
        document.body.classList.toggle('access-contrast');
      });

      document.getElementById('btn-reset').addEventListener('click', () => {
        document.body.classList.remove('access-large-text', 'access-contrast');
      });

      // 👁️ מנגנון חכם העוקב אחר שינויים באתר ומעלים את הכפתור הישן ברגע ש-React יוצרת אותו
      const observer = new MutationObserver(() => {
        const oldBtn = document.querySelector('button[aria-label*="נגיש"], button[title*="נגיש"], .accessibility-btn, button:has(svg circle[cx="12"])');
        if (oldBtn) {
          oldBtn.style.setProperty('display', 'none', 'important');
          oldBtn.style.setProperty('opacity', '0', 'important');
          oldBtn.style.setProperty('pointer-events', 'none', 'important');
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
